<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context-based Position Finding Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 {
      color: #4ec9b0;
      border-bottom: 2px solid #4ec9b0;
      padding-bottom: 10px;
    }
    h2 {
      color: #569cd6;
      margin-top: 30px;
    }
    .test-case {
      background: #252526;
      border: 1px solid #3e3e42;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    .test-case h3 {
      color: #dcdcaa;
      margin-top: 0;
    }
    .code-block {
      background: #1e1e1e;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 12px;
      margin: 10px 0;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      overflow-x: auto;
    }
    .original { border-left: 3px solid #ce9178; }
    .suggestion { border-left: 3px solid #4ec9b0; }
    .result { border-left: 3px solid #569cd6; }
    .label {
      font-weight: bold;
      color: #9cdcfe;
      margin-bottom: 5px;
    }
    .success {
      color: #4ec9b0;
      font-weight: bold;
    }
    .error {
      color: #f48771;
      font-weight: bold;
    }
    .warning {
      color: #dcdcaa;
      font-weight: bold;
    }
    .stats {
      background: #252526;
      border: 2px solid #4ec9b0;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #4ec9b0;
    }
    .stat-label {
      color: #9cdcfe;
      margin-top: 5px;
    }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #1177bb;
    }
    .json-display {
      background: #1e1e1e;
      border: 1px solid #3e3e42;
      border-radius: 4px;
      padding: 12px;
      margin: 10px 0;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      overflow-x: auto;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>🎯 Context-based Position Finding Test</h1>
  <p>测试 3 层降级策略：Context → Tree-sitter → fast-diff</p>

  <button onclick="runAllTests()">▶️ Run All Tests</button>
  <button onclick="clearResults()">🗑️ Clear Results</button>

  <div class="stats" id="stats">
    <div class="stat-item">
      <div class="stat-value" id="total-tests">0</div>
      <div class="stat-label">Total Tests</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="passed-tests">0</div>
      <div class="stat-label">Passed</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="failed-tests">0</div>
      <div class="stat-label">Failed</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="accuracy">0%</div>
      <div class="stat-label">Accuracy</div>
    </div>
  </div>

  <div id="test-results"></div>

  <script type="module">
    // Import PositionFinder and CoordinateFixer
    import { PositionFinder } from '../ai-code-assistant/shared/PositionFinder.ts';
    import { CoordinateFixer } from '../ai-code-assistant/shared/CoordinateFixer.ts';

    // Test cases from design document
    const testCases = [
      {
        name: '场景 1: 简单替换',
        difficulty: '⭐',
        lineContent: 'const name = "john";',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_WORD',
          suggestionText: 'const username = "john";',
          originalLineContent: 'const name = "john";',
          explanation: 'Rename variable',
          context: {
            before: 'const ',
            target: 'name',
            after: ' = "john'
          }
        },
        expected: {
          startColumn: 7,
          endColumn: 11,
          word: 'name'
        }
      },
      {
        name: '场景 2: 多处相同文本',
        difficulty: '⭐⭐',
        lineContent: 'const name = "name";',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_WORD',
          suggestionText: 'const username = "name";',
          originalLineContent: 'const name = "name";',
          explanation: 'Rename first name (variable)',
          context: {
            before: 'const ',
            target: 'name',
            after: ' = "'
          }
        },
        expected: {
          startColumn: 7,
          endColumn: 11,
          word: 'name'
        }
      },
      {
        name: '场景 3: 嵌套相同文本',
        difficulty: '⭐⭐⭐',
        lineContent: 'function test(name, age) { return name; }',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_WORD',
          suggestionText: 'function test(name, age) { return username; }',
          originalLineContent: 'function test(name, age) { return name; }',
          explanation: 'Rename second name (in return)',
          context: {
            before: 'return ',
            target: 'name',
            after: '; }'
          }
        },
        expected: {
          startColumn: 35,
          endColumn: 39,
          word: 'name'
        }
      },
      {
        name: '场景 4: 前导空格',
        difficulty: '⭐⭐',
        lineContent: '  const x = 1;',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_LINE',
          suggestionText: 'const x = 1;',
          originalLineContent: '  const x = 1;',
          explanation: 'Remove leading spaces'
        },
        expected: null // REPLACE_LINE doesn't need column info
      },
      {
        name: '场景 5: 行尾修改',
        difficulty: '⭐',
        lineContent: 'const x = 1',
        prediction: {
          targetLine: 1,
          changeType: 'INLINE_INSERT',
          suggestionText: 'const x = 1;',
          originalLineContent: 'const x = 1',
          explanation: 'Add semicolon',
          context: {
            before: 'x = ',
            target: '1',
            after: ''
          }
        },
        expected: {
          insertColumn: 12,  // ✅ 修正：在 "1" 之后插入（endColumn）
          insertAfter: true
        }
      },
      {
        name: '场景 6: 字符串内修改',
        difficulty: '⭐⭐',
        lineContent: 'const msg = "hello world";',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_WORD',
          suggestionText: 'const msg = "hi world";',
          originalLineContent: 'const msg = "hello world";',
          explanation: 'Replace hello with hi',
          context: {
            before: '= "',
            target: 'hello',
            after: ' world'
          }
        },
        expected: {
          startColumn: 14,
          endColumn: 19,
          word: 'hello'
        }
      },
      {
        name: '场景 7: 注释修改',
        difficulty: '⭐',
        lineContent: '// TODO: fix this',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_WORD',
          suggestionText: '// DONE: fix this',
          originalLineContent: '// TODO: fix this',
          explanation: 'Mark as done',
          context: {
            before: '// ',
            target: 'TODO',
            after: ': fix'
          }
        },
        expected: {
          startColumn: 4,
          endColumn: 8,
          word: 'TODO'
        }
      },
      {
        name: '场景 8: INLINE_INSERT 添加参数',
        difficulty: '⭐⭐',
        lineContent: 'const user2 = createUser("Bob");',
        prediction: {
          targetLine: 1,
          changeType: 'INLINE_INSERT',
          suggestionText: 'const user2 = createUser("Bob", 30);',
          originalLineContent: 'const user2 = createUser("Bob");',
          explanation: 'Add age parameter',
          context: {
            before: 'User("Bob"',
            target: '',
            after: ');'
          }
        },
        expected: {
          startColumn: 31,
          insertAfter: true
        }
      },
      {
        name: '场景 9: 函数名修改',
        difficulty: '⭐⭐',
        lineContent: 'const user1 = createUser("Alice", 0, "alice@example.com");',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_WORD',
          suggestionText: 'const user1 = createUserInfo("Alice", 0, "alice@example.com");',
          originalLineContent: 'const user1 = createUser("Alice", 0, "alice@example.com");',
          explanation: 'Rename function',
          context: {
            before: 'user1 = ',
            target: 'createUser',
            after: '("Alice"'
          }
        },
        expected: {
          startColumn: 15,
          endColumn: 25,
          word: 'createUser'
        }
      },
      {
        name: '场景 10: 无 context 降级测试（fast-diff 可能失败）',
        difficulty: '⭐⭐⭐',
        lineContent: 'const user = createUser("Alice");',
        prediction: {
          targetLine: 1,
          changeType: 'REPLACE_WORD',
          suggestionText: 'const user = getUser("Alice");',
          originalLineContent: 'const user = createUser("Alice");',
          explanation: 'Test fallback without context - fast-diff may detect multiple changes'
          // No context - should fallback to fast-diff
        },
        expected: null  // fast-diff 会检测到多处变更，返回 null（正确行为）
      }
    ];

    const fixer = new CoordinateFixer();
    let testResults = [];

    window.runAllTests = function() {
      testResults = [];
      const resultsDiv = document.getElementById('test-results');
      resultsDiv.innerHTML = '<h2>🧪 Test Results</h2>';

      let passed = 0;
      let failed = 0;

      testCases.forEach((testCase, index) => {
        const result = runTest(testCase, index + 1);
        testResults.push(result);
        
        if (result.passed) passed++;
        else failed++;

        resultsDiv.appendChild(createTestResultElement(result));
      });

      updateStats(testCases.length, passed, failed);
    };

    function runTest(testCase, testNumber) {
      const startTime = performance.now();
      
      try {
        // Use CoordinateFixer to fix coordinates
        const fixedPrediction = fixer.fix(testCase.prediction, testCase.lineContent);
        
        const endTime = performance.now();
        const duration = (endTime - startTime).toFixed(2);

        // Check results
        let passed = true;
        let errors = [];

        if (testCase.expected === null) {
          // REPLACE_LINE 或 fast-diff 失败 - 不需要验证列信息
          passed = true;  // 只要不抛出异常就算通过
        } else {
          // Check wordReplaceInfo or inlineInsertInfo
          if (testCase.prediction.changeType === 'REPLACE_WORD') {
            if (!fixedPrediction.wordReplaceInfo) {
              passed = false;
              errors.push('wordReplaceInfo is missing');
            } else {
              if (fixedPrediction.wordReplaceInfo.startColumn !== testCase.expected.startColumn) {
                passed = false;
                errors.push(`startColumn: expected ${testCase.expected.startColumn}, got ${fixedPrediction.wordReplaceInfo.startColumn}`);
              }
              if (fixedPrediction.wordReplaceInfo.endColumn !== testCase.expected.endColumn) {
                passed = false;
                errors.push(`endColumn: expected ${testCase.expected.endColumn}, got ${fixedPrediction.wordReplaceInfo.endColumn}`);
              }
            }
          } else if (testCase.prediction.changeType === 'INLINE_INSERT') {
            if (!fixedPrediction.inlineInsertInfo) {
              passed = false;
              errors.push('inlineInsertInfo is missing');
            } else {
              const expectedColumn = testCase.expected.startColumn || testCase.expected.insertColumn;
              if (fixedPrediction.inlineInsertInfo.insertColumn !== expectedColumn) {
                passed = false;
                errors.push(`insertColumn: expected ${expectedColumn}, got ${fixedPrediction.inlineInsertInfo.insertColumn}`);
              }
            }
          }
        }

        return {
          testNumber,
          name: testCase.name,
          difficulty: testCase.difficulty,
          passed,
          errors,
          duration,
          lineContent: testCase.lineContent,
          prediction: testCase.prediction,
          fixedPrediction,
          expected: testCase.expected
        };
      } catch (error) {
        const endTime = performance.now();
        const duration = (endTime - startTime).toFixed(2);

        return {
          testNumber,
          name: testCase.name,
          difficulty: testCase.difficulty,
          passed: false,
          errors: [error.message],
          duration,
          lineContent: testCase.lineContent,
          prediction: testCase.prediction,
          error: error.stack
        };
      }
    }

    function createTestResultElement(result) {
      const div = document.createElement('div');
      div.className = 'test-case';
      
      const statusClass = result.passed ? 'success' : 'error';
      const statusIcon = result.passed ? '✅' : '❌';
      
      div.innerHTML = `
        <h3>${statusIcon} Test ${result.testNumber}: ${result.name} ${result.difficulty}</h3>
        <div class="label">Status: <span class="${statusClass}">${result.passed ? 'PASSED' : 'FAILED'}</span> (${result.duration}ms)</div>
        
        <div class="label">Original Line:</div>
        <div class="code-block original">${escapeHtml(result.lineContent)}</div>
        
        <div class="label">Prediction Context:</div>
        <div class="json-display">${JSON.stringify(result.prediction.context || 'No context', null, 2)}</div>
        
        ${result.fixedPrediction ? `
          <div class="label">Fixed Prediction:</div>
          <div class="json-display">${JSON.stringify({
            changeType: result.fixedPrediction.changeType,
            wordReplaceInfo: result.fixedPrediction.wordReplaceInfo,
            inlineInsertInfo: result.fixedPrediction.inlineInsertInfo
          }, null, 2)}</div>
        ` : ''}
        
        ${result.expected ? `
          <div class="label">Expected:</div>
          <div class="json-display">${JSON.stringify(result.expected, null, 2)}</div>
        ` : ''}
        
        ${result.errors.length > 0 ? `
          <div class="label">Errors:</div>
          <div class="code-block error">
            ${result.errors.map(e => `• ${escapeHtml(e)}`).join('<br>')}
          </div>
        ` : ''}
        
        ${result.error ? `
          <div class="label">Stack Trace:</div>
          <div class="code-block error">${escapeHtml(result.error)}</div>
        ` : ''}
      `;
      
      return div;
    }

    function updateStats(total, passed, failed) {
      document.getElementById('total-tests').textContent = total;
      document.getElementById('passed-tests').textContent = passed;
      document.getElementById('failed-tests').textContent = failed;
      
      const accuracy = total > 0 ? ((passed / total) * 100).toFixed(1) : 0;
      document.getElementById('accuracy').textContent = accuracy + '%';
      
      const accuracyElement = document.getElementById('accuracy');
      if (accuracy >= 90) {
        accuracyElement.style.color = '#4ec9b0';
      } else if (accuracy >= 70) {
        accuracyElement.style.color = '#dcdcaa';
      } else {
        accuracyElement.style.color = '#f48771';
      }
    }

    window.clearResults = function() {
      document.getElementById('test-results').innerHTML = '';
      updateStats(0, 0, 0);
    };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Auto-run tests on load
    console.log('Context-based Position Finding Test loaded');
    console.log('Click "Run All Tests" to start');
  </script>
</body>
</html>
